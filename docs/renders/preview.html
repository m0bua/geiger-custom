<div id="geiger-display-pages-redrawn" class="viz-dotted-background" role="group" aria-label="Geiger-2 display screens">
  <style>
    #geiger-display-pages-redrawn {
      --g-body:#20282b; --g-bezel:#101618;
      box-sizing:border-box; width:100%; padding:20px 12px;
      display:grid; justify-items:center; gap:24px; background:transparent;
    }
    #geiger-display-pages-redrawn * { box-sizing:border-box; }
    #geiger-display-pages-redrawn .screen-block { width:min(100%,528px); }
    #geiger-display-pages-redrawn .screen-name { margin:0 0 8px 2px; }
    #geiger-display-pages-redrawn .device {
      width:100%; padding:15px; border-radius:24px;
      background:linear-gradient(145deg,#30393c,var(--g-body) 42%,#171d20);
      box-shadow:0 16px 42px rgba(0,0,0,.28),inset 0 1px rgba(255,255,255,.09);
    }
    #geiger-display-pages-redrawn .bezel {
      padding:9px; border-radius:14px; background:var(--g-bezel);
      box-shadow:inset 0 2px 7px rgba(0,0,0,.75),0 1px rgba(255,255,255,.06);
    }
    #geiger-display-pages-redrawn .screen {
      display:block; width:100%; aspect-ratio:2/1; overflow:hidden;
      border-radius:3px; background:#000; image-rendering:pixelated;
    }
    @media (max-width:380px) {
      #geiger-display-pages-redrawn { padding:12px 4px; gap:18px; }
      #geiger-display-pages-redrawn .device { padding:10px; border-radius:19px; }
      #geiger-display-pages-redrawn .bezel { padding:6px; }
      #geiger-display-pages-redrawn .screen { border-radius:2px; }
    }
  </style>
