[platformio]
default_envs = geiger2
boards_dir = boards
src_dir = .
include_dir = include
extra_configs = platformio.local.ini

[env:geiger2]
platform = ststm32
board = geiger2_stm32l051c8

; Bare-metal firmware: keep the project's own startup and linker script.
board_build.ldscript = linker/STM32L051C8TX_FLASH.ld
extra_scripts = pre:tools/bare_metal.py
build_src_filter = +<src/> +<startup_stm32l051.S> -<build/> -<.pio/> -<docs/>
build_flags =
    -mcpu=cortex-m0plus
    -mthumb
    -Os
    -g2
    -ffunction-sections
    -fdata-sections
    -fno-inline-small-functions
    -fno-tree-switch-conversion
    -Wall
    -Wextra
    -Werror
    -Wl,--gc-sections
    -Wl,-Map,$BUILD_DIR/geiger2.map
build_unflags = -Og
build_type = release

[env:geiger2_release]
extends = env:geiger2
build_unflags =
build_type = release

; Requires an ST-Link connected to SWDIO/SWCLK/GND (NRST recommended).
upload_protocol = stlink
debug_tool = stlink
