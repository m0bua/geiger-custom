name: Build app release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: app-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js for Terser
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the firmware's pinned ARM toolchain
        run: |
          python -m pip install platformio==6.1.18
          pio pkg install --global --tool platformio/toolchain-gccarmnoneeabi@1.70201.0

      - name: Set release version
        id: release
        run: echo "tag=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

      - name: Build firmware and standalone app
        run: |
          pio run -e geiger2_spi_mini
          python tools/build_release.py --version "${{ steps.release.outputs.tag }}" --spi-mini-bin .pio/build/geiger2_spi_mini/firmware.bin --require-minifier

      - name: Upload standalone HTML
        uses: actions/upload-artifact@v4
        with:
          name: release-html
          path: dist/Dosimeter-App.html
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload firmware BIN
        uses: actions/upload-artifact@v4
        with:
          name: release-firmware
          path: .pio/scratch/geiger2_manual/firmware.bin
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload SPI service firmware BIN
        uses: actions/upload-artifact@v4
        with:
          name: release-spi-mini
          path: .pio/build/geiger2_spi_mini/firmware.bin
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  build-windows:
    needs: build-app
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js for Terser
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install desktop packaging dependencies
        run: python -m pip install -r tools/windows_app_requirements.txt

      - name: Download release BIN for matching check
        uses: actions/download-artifact@v4
        with:
          name: release-firmware
          path: expected-firmware

      - name: Download SPI service firmware
        uses: actions/download-artifact@v4
        with:
          name: release-spi-mini
          path: expected-spi-mini

      - name: Build Windows executable
        run: python tools/build_windows_app.py --version "${{ needs.build-app.outputs.tag }}" --firmware-bin expected-firmware\firmware.bin --spi-mini-bin expected-spi-mini\firmware.bin --require-minifier

      - name: Verify the embedded firmware matches the release BIN
        shell: pwsh
        run: |
          $expected = (Get-FileHash expected-firmware\firmware.bin -Algorithm SHA256).Hash
          $built = (Get-FileHash .pio\scratch\geiger2_manual\firmware.bin -Algorithm SHA256).Hash
          if ($expected -ne $built) { throw "Windows EXE firmware differs from release BIN: $built != $expected" }

      - name: Verify the embedded SPI service image matches the release BIN
        shell: pwsh
        run: |
          $expected = (Get-FileHash expected-spi-mini\firmware.bin -Algorithm SHA256).Hash
          $built = (Get-FileHash .pio\build\geiger2_spi_mini\firmware.bin -Algorithm SHA256).Hash
          if ($expected -ne $built) { throw "Windows EXE SPI service image differs from release BIN: $built != $expected" }

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/windows/Dosimeter-App.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish-release:
    needs: [build-app, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download standalone HTML
        uses: actions/download-artifact@v4
        with:
          name: release-html
          path: dist

      - name: Download firmware BIN
        uses: actions/download-artifact@v4
        with:
          name: release-firmware
          path: .pio/scratch/geiger2_manual

      - name: Download Windows executable
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: dist/windows

      - name: Download SPI service firmware
        uses: actions/download-artifact@v4
        with:
          name: release-spi-mini
          path: dist/spi-mini-staging

      - name: Publish all release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build-app.outputs.tag }}
        run: |
          cp dist/spi-mini-staging/firmware.bin dist/spi-service-firmware.bin
          firmware=".pio/scratch/geiger2_manual/firmware.bin"
          firmware_sha256="$(sha256sum "$firmware" | cut -d ' ' -f1)"
          canonical_sha256="$(python -c 'from pathlib import Path; import hashlib; b=Path(".pio/scratch/geiger2_manual/firmware.bin").read_bytes(); print(hashlib.sha256(b.ljust(65536, bytes([255]))).hexdigest())')"
          windows_sha256="$(sha256sum dist/windows/Dosimeter-App.exe | cut -d ' ' -f1)"
          cat > /tmp/release-notes.md <<EOF
          Firmware and companion app release.

          Includes the standalone Windows EXE with an integrated COM-port connection and firmware programming, alongside the single-file HTML app and firmware BIN.

          The HTML and EXE include a recovery-backed SPI NOR dump flow and the matching temporary SPI service firmware.

          ## Changes
          - Improved parallel minute, hour, and day logging and faster log retrieval.
          - Improved minute, hour, and day graph navigation, cursor behavior, and redraw performance.
          - Expanded EEPROM and SPI NOR dump, flash, restore, and erase controls.
          - Improved Windows COM-port selection and the settings layout.
          - Centralized the firmware display palette for easier theme changes.

          Firmware BIN SHA-256: ${firmware_sha256}
          Canonical 64 KiB flash image SHA-256 (0xFF padded; used for app compatibility checks): ${canonical_sha256}
          Windows desktop app SHA-256: ${windows_sha256}

          Built from commit ${GITHUB_SHA}. Release timestamp and version are UTC.
          EOF
          gh release create "$RELEASE_TAG" \
            dist/Dosimeter-App.html \
            "$firmware" \
            dist/spi-service-firmware.bin \
            dist/windows/Dosimeter-App.exe \
            --title "APP-$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --notes-file /tmp/release-notes.md
