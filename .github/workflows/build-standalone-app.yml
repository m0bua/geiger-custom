name: Build app release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: app-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-fw:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the firmware's pinned ARM toolchain
        run: |
          python -m pip install platformio==6.1.18
          pio pkg install --global --platform platformio/ststm32@20.0.0
          pio pkg install --global --tool platformio/toolchain-gccarmnoneeabi@1.70201.0

      - name: Build FW
        run: python tools/build_firmware.py

      - name: Upload FW
        uses: actions/upload-artifact@v4
        with:
          name: release-firmware
          path: .pio/scratch/geiger2_manual/firmware.bin
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  build-fw-spi:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.18

      - name: Build FW-SPI
        run: pio run -e geiger2_spi_mini

      - name: Upload FW-SPI
        uses: actions/upload-artifact@v4
        with:
          name: release-spi-mini
          path: .pio/build/geiger2_spi_mini/firmware.bin
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  check-stock-sources:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify stock firmware and source manifest
        run: python tools/verify_stock_sources.py

  build-app:
    needs: [build-fw, build-fw-spi, check-stock-sources]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js for Terser
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set release version
        id: release
        run: echo "tag=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

      - name: Download FW
        uses: actions/download-artifact@v4
        with:
          name: release-firmware
          path: firmware-staging

      - name: Download FW-SPI
        uses: actions/download-artifact@v4
        with:
          name: release-spi-mini
          path: spi-mini-staging

      - name: Build APP
        run: >-
          python tools/build_release.py
          --version "${{ steps.release.outputs.tag }}"
          --firmware-bin firmware-staging/firmware.bin
          --spi-mini-bin spi-mini-staging/firmware.bin
          --require-minifier

      - name: Verify APP embedded images and source links
        run: >-
          python tools/verify_embedded_images.py
          --html dist/Dosimeter.html
          --firmware-bin firmware-staging/firmware.bin
          --spi-mini-bin spi-mini-staging/firmware.bin

      - name: Upload APP
        uses: actions/upload-artifact@v4
        with:
          name: release-html
          path: dist/Dosimeter.html
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  build-windows:
    needs: [build-app, build-fw, build-fw-spi]
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js for Terser
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install desktop packaging dependencies
        run: python -m pip install -r tools/windows_app_requirements.txt

      - name: Download release BIN for matching check
        uses: actions/download-artifact@v4
        with:
          name: release-firmware
          path: expected-firmware

      - name: Download SPI service firmware
        uses: actions/download-artifact@v4
        with:
          name: release-spi-mini
          path: expected-spi-mini

      - name: Build Windows executable
        run: python tools/build_windows_app.py --version "${{ needs.build-app.outputs.tag }}" --firmware-bin expected-firmware\firmware.bin --spi-mini-bin expected-spi-mini\firmware.bin --require-minifier

      - name: Verify firmware embedded in the Windows app
        run: >-
          python tools/verify_embedded_images.py
          --html .pio/scratch/windows-app/bundle/app/index.html
          --firmware-bin expected-firmware/firmware.bin
          --spi-mini-bin expected-spi-mini/firmware.bin

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/windows/Dosimeter.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish-release:
    needs: [build-fw, build-fw-spi, check-stock-sources, build-app, build-windows]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download standalone HTML
        uses: actions/download-artifact@v4
        with:
          name: release-html
          path: dist

      - name: Download firmware BIN
        uses: actions/download-artifact@v4
        with:
          name: release-firmware
          path: .pio/scratch/geiger2_manual

      - name: Download Windows executable
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: dist/windows

      - name: Download SPI service firmware
        uses: actions/download-artifact@v4
        with:
          name: release-spi-mini
          path: dist/spi-mini-staging

      - name: Publish all release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build-app.outputs.tag }}
        run: |
          cp dist/spi-mini-staging/firmware.bin dist/spi-service-firmware.bin
          firmware=".pio/scratch/geiger2_manual/firmware.bin"
          firmware_sha256="$(sha256sum "$firmware" | cut -d ' ' -f1)"
          canonical_sha256="$(python -c 'from pathlib import Path; import hashlib; b=Path(".pio/scratch/geiger2_manual/firmware.bin").read_bytes(); print(hashlib.sha256(b.ljust(65536, bytes([255]))).hexdigest())')"
          windows_sha256="$(sha256sum dist/windows/Dosimeter.exe | cut -d ' ' -f1)"
          cat > /tmp/release-notes.md <<EOF
          Firmware and companion app release.

          Includes the standalone Windows EXE with an integrated COM-port connection and firmware programming, alongside the single-file HTML app and firmware BIN.

          The HTML and EXE include a recovery-backed SPI NOR dump flow and the matching temporary SPI service firmware.

          ## Changes
          **Changes since 202611112101:**
          - Earlier changes after the previous stable release were companion-app only; this release also includes the device-rate changes below.
          - Added offline log import for app-exported CSV files and complete EEPROM/SPI BIN dumps. CSV imports merge into the archive; BIN imports replace it. Imported records can be browsed and exported without a device connection.
          - Added Export All for records already loaded across log types. It skips types with no loaded records and does not fetch additional data.
          - Added pagination for large log tables, shown above 100 loaded records, with page-size choices from 10 through 5,000 or All; the default is 1,000.
          - The device now eases falling NORMAL rate readings down smoothly using elapsed time while responding quickly to increases. Rate refresh priority is SEARCH or USB every 100 ms, screen on every 500 ms, NORMAL with screen off every second, and INVISIBLE with screen off and no USB every 5 seconds. In the economical states, a pulse triggers an immediate refresh and resets the timer; measurement, logs, and alarms retain their existing one-second cadence.
          - The companion app polls device status every 100 ms and keeps graph history in one-second buckets, accumulating pulse counts in each point. Touchscreens support two-finger pinch zoom around the gesture center and one-finger drag scrolling.
          - Live log refresh preserves row order and rereads the preceding live record from the device at a period boundary so its final values replace the in-progress record, including when it is on a later page.
          - Updated mobile layouts for settings, display themes, and navigation. On Android, Connect USB is the green primary action; Firefox for Android offers Open in Chrome for USB access and hides its unsupported Install button.
          - Updated the release portal to show the three newest stable releases and the first newer pre-release initially, with separate stable history and shared pre-release history controls.
          - Refreshed the manual's large screen digits to match the current Anonymous Pro Bold device font.

          ### Known issue
          Battery percentage can jump while discharging; this remains under investigation.

          Firmware BIN SHA-256: ${firmware_sha256}
          Canonical 64 KiB flash image SHA-256 (0xFF padded; used for app compatibility checks): ${canonical_sha256}
          Windows desktop app SHA-256: ${windows_sha256}

          Built from commit ${GITHUB_SHA}. Release timestamp and version are UTC.
          EOF
          gh release create "$RELEASE_TAG" \
            dist/Dosimeter.html \
            "$firmware" \
            dist/spi-service-firmware.bin \
            dist/windows/Dosimeter.exe \
            --title "Dosimeter-$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --notes-file /tmp/release-notes.md
