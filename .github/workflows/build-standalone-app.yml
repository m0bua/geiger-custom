name: Build app release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: app-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-fw:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the firmware's pinned ARM toolchain
        run: |
          python -m pip install platformio==6.1.18
          pio pkg install --global --platform platformio/ststm32@20.0.0
          pio pkg install --global --tool platformio/toolchain-gccarmnoneeabi@1.70201.0

      - name: Build FW
        run: python tools/build_firmware.py

      - name: Upload FW
        uses: actions/upload-artifact@v4
        with:
          name: release-firmware
          path: .pio/scratch/geiger2_manual/firmware.bin
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  build-fw-spi:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.18

      - name: Build FW-SPI
        run: pio run -e geiger2_spi_mini

      - name: Upload FW-SPI
        uses: actions/upload-artifact@v4
        with:
          name: release-spi-mini
          path: .pio/build/geiger2_spi_mini/firmware.bin
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  check-stock-sources:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify stock firmware and source manifest
        run: python tools/verify_stock_sources.py

  build-app:
    needs: [build-fw, build-fw-spi, check-stock-sources]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js for Terser
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set release version
        id: release
        run: echo "tag=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

      - name: Download FW
        uses: actions/download-artifact@v4
        with:
          name: release-firmware
          path: firmware-staging

      - name: Download FW-SPI
        uses: actions/download-artifact@v4
        with:
          name: release-spi-mini
          path: spi-mini-staging

      - name: Build APP
        run: >-
          python tools/build_release.py
          --version "${{ steps.release.outputs.tag }}"
          --firmware-bin firmware-staging/firmware.bin
          --spi-mini-bin spi-mini-staging/firmware.bin
          --require-minifier

      - name: Verify APP embedded images and source links
        run: >-
          python tools/verify_embedded_images.py
          --html dist/Dosimetr.html
          --firmware-bin firmware-staging/firmware.bin
          --spi-mini-bin spi-mini-staging/firmware.bin

      - name: Upload APP
        uses: actions/upload-artifact@v4
        with:
          name: release-html
          path: dist/Dosimetr.html
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  build-windows:
    needs: [build-app, build-fw, build-fw-spi]
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js for Terser
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install desktop packaging dependencies
        run: python -m pip install -r tools/windows_app_requirements.txt

      - name: Download release BIN for matching check
        uses: actions/download-artifact@v4
        with:
          name: release-firmware
          path: expected-firmware

      - name: Download SPI service firmware
        uses: actions/download-artifact@v4
        with:
          name: release-spi-mini
          path: expected-spi-mini

      - name: Build Windows executable
        run: python tools/build_windows_app.py --version "${{ needs.build-app.outputs.tag }}" --firmware-bin expected-firmware\firmware.bin --spi-mini-bin expected-spi-mini\firmware.bin --require-minifier

      - name: Verify firmware embedded in the Windows app
        run: >-
          python tools/verify_embedded_images.py
          --html .pio/scratch/windows-app/bundle/app/index.html
          --firmware-bin expected-firmware/firmware.bin
          --spi-mini-bin expected-spi-mini/firmware.bin

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/windows/Dosimetr.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish-release:
    needs: [build-fw, build-fw-spi, check-stock-sources, build-app, build-windows]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download standalone HTML
        uses: actions/download-artifact@v4
        with:
          name: release-html
          path: dist

      - name: Download firmware BIN
        uses: actions/download-artifact@v4
        with:
          name: release-firmware
          path: .pio/scratch/geiger2_manual

      - name: Download Windows executable
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: dist/windows

      - name: Download SPI service firmware
        uses: actions/download-artifact@v4
        with:
          name: release-spi-mini
          path: dist/spi-mini-staging

      - name: Publish all release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build-app.outputs.tag }}
        run: |
          cp dist/spi-mini-staging/firmware.bin dist/spi-service-firmware.bin
          firmware=".pio/scratch/geiger2_manual/firmware.bin"
          firmware_sha256="$(sha256sum "$firmware" | cut -d ' ' -f1)"
          canonical_sha256="$(python -c 'from pathlib import Path; import hashlib; b=Path(".pio/scratch/geiger2_manual/firmware.bin").read_bytes(); print(hashlib.sha256(b.ljust(65536, bytes([255]))).hexdigest())')"
          windows_sha256="$(sha256sum dist/windows/Dosimetr.exe | cut -d ' ' -f1)"
          cat > /tmp/release-notes.md <<EOF
          Firmware and companion app release.

          Includes the standalone Windows EXE with an integrated COM-port connection and firmware programming, alongside the single-file HTML app and firmware BIN.

          The HTML and EXE include a recovery-backed SPI NOR dump flow and the matching temporary SPI service firmware.

          ## Changes
          **Changes since APP-202610291321:**
          - Added app device controls for screen wake, NORMAL/INVISIBLE/SEARCH, flashlight, and screen always-on with automatic return to AUTO after normal or lost app connection.
          - Added LED COLOR (STOCK/THEME) before LED TIME; THEME uses the saved display palette for pulse indication colors and old settings migrate to STOCK.
          - Shortened PlatformIO serial upload output to live 10% checkpoints while retaining write verification and errors.
          - Reworked the device settings menu and persistence: reordered menu items, separated LED TIME from LED BRIGHT, added configurable startup-screen behavior, fixed two-row unit handling, improved battery-life behavior, and added smooth screen-timeout dimming.
          - Added BATT FORMAT (% / V / RAW) for the device's main screens and app settings. Debug shows complementary battery readings: voltage for %, percentage for V, and voltage plus percentage for RAW; app Debug includes battery RAW and Li-ion voltage.
          - Added editable LCD palettes and presets (Dark, Light, Ocean, Amber, Violet, Monokai, Dracula, Nord, and Solarized Dark), theme-aware rate levels, configurable dimming for incomplete graph columns, and palette-code export/import.
          - Reorganized device Debug pages to emphasize time/date/CNT, with battery and power readings plus combined WAKE/SLEEP/UPTIME on the next page. Improved app Debug voltage precision and USB/SOL presentation.
          - Raised the clock temporarily while aggregating hourly and daily records, then returned to the idle clock to preserve logging accuracy with low-power timing.
          - Reduced firmware Flash use by removing unused legacy display code and simplifying rendering helpers.
          - Improved rate/search behavior: SEARCH updates every 100 ms, reacts immediately to pulses, eases down between pulses, supports more Sv/R precision, and uses brighter LED indication; NORMAL updates every 500 ms and continues rate updates while the display is off.
          - Reworked dose and logging calculations to follow logged pulse counts, disabled automatic hourly dose resynchronization, corrected DAY/TOTAL after loading the DAY graph, and fixed DOSE ROW 2 CPM to use measured CPM.
          - Improved minute/hour/day logging and coverage: monotonic minute/hour boundaries with a stable RTC offset, delayed-sampling protection, correct complete/partial coverage colors, exclusion of the 30-pulse warm-up from persistent logs, and continued live RAM history/dose updates.
          - Fixed false one-second partial coverage after log cleanup, added RAM live aggregates for the current hour and day, and made hour/day history use matching aggregate streams to avoid duplicate SPI scans.
          - Expanded live rate history to 3, 5, and 10 minutes with separate resolutions and fixed graph cursor redraw, edge cleanup, and stale-pixel handling.
          - Expanded the Logs viewer with full-screen mode, compact coverage and alert-duration formatting, incremental loading, up to ten records per exchange, Stop-after-current-request, More for Latest/Count/All/Dates, stable headers/totals, hover fixes, and an adaptive window-height panel that scrolls only its records.
          - Added permanent browser-stored FLASH backups before firmware/SPI writes, separate manual FLASH dump/restore storage, temporary SPI recovery backups, restore actions, and erase protection when SPI contents are unrecognized.
          - Improved Firmware Activity and diagnostics: grouped activity by action, retained the visible log until manually cleared, added protocol/firmware operation reporting, and added F5 refresh to the Windows app.
          - Refined Overview metrics, Settings layout, warm-up CNT alignment, complementary CPM/CPS selection, demo placeholders, backlight fading, and reset behavior for active logs.
          - Added Android/PWA USB support and improved mobile layout, Web Serial/WebUSB reconnect behavior, Windows COM-port selection, application naming, and standalone release packaging.
          - Expanded the stock firmware catalog with newly published images and source links; improved Quick flash, firmware validation, startup/recovery handling, and release portal versioning.
          - Fixed LTO startup by preserving the real SysTick handler; aligned standalone and PlatformIO builds, added startup/vector validation, and verified UART HEX programming.
          - Added battery/ADC, display, logging, protocol, storage, and release documentation plus regression coverage for dose, logs, storage, and embedded images.

          Firmware BIN SHA-256: ${firmware_sha256}
          Canonical 64 KiB flash image SHA-256 (0xFF padded; used for app compatibility checks): ${canonical_sha256}
          Windows desktop app SHA-256: ${windows_sha256}

          Built from commit ${GITHUB_SHA}. Release timestamp and version are UTC.
          EOF
          gh release create "$RELEASE_TAG" \
            dist/Dosimetr.html \
            "$firmware" \
            dist/spi-service-firmware.bin \
            dist/windows/Dosimetr.exe \
            --title "Dosimetr-$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --notes-file /tmp/release-notes.md
