name: Build standalone app

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: standalone-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js for Terser
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the firmware's pinned ARM toolchain
        run: |
          python -m pip install platformio==6.1.18
          pio pkg install --global --tool platformio/toolchain-gccarmnoneeabi@1.70201.0

      - name: Set release version
        id: release
        run: echo "tag=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

      - name: Build firmware and standalone app
        run: python tools/build_release.py --version "${{ steps.release.outputs.tag }}" --require-minifier

      - name: Upload standalone HTML
        uses: actions/upload-artifact@v4
        with:
          name: Dosimeter-App
          path: |
            dist/Dosimeter-App.html
            .pio/scratch/geiger2_manual/firmware.bin
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_time="${{ steps.release.outputs.tag }}"
          tag="$release_time"
          firmware=".pio/scratch/geiger2_manual/firmware.bin"
          firmware_sha256="$(sha256sum "$firmware" | cut -d ' ' -f1)"
          canonical_sha256="$(python -c 'from pathlib import Path; import hashlib; b=Path(".pio/scratch/geiger2_manual/firmware.bin").read_bytes(); print(hashlib.sha256(b.ljust(65536, bytes([255]))).hexdigest())')"
          cat > /tmp/release-notes.md <<EOF
          First production-ready app and firmware build.

          Firmware BIN SHA-256: ${firmware_sha256}
          Canonical 64 KiB flash image SHA-256 (0xFF padded; used for app compatibility checks): ${canonical_sha256}

          Built from commit ${GITHUB_SHA}. Release timestamp and version are UTC.
          EOF
          gh release create "$tag" \
            dist/Dosimeter-App.html \
            "$firmware" \
            --title "APP-$release_time" \
            --target "$GITHUB_SHA" \
            --notes-file /tmp/release-notes.md
