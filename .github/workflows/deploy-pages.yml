name: Deploy Device Monitor portal

on:
  workflow_run:
    workflows: [Build app release, Build dev pre-release]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build SPI service firmware for the live app
        run: |
          python -m pip install platformio==6.1.18
          pio pkg install --global --tool platformio/toolchain-gccarmnoneeabi@1.70201.0
          pio run -e geiger2_spi_mini

      - name: Assemble portal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > /tmp/releases.json
          python tools/build_pages.py --releases-json /tmp/releases.json --spi-mini-bin .pio/build/geiger2_spi_mini/firmware.bin

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/gh-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
