name: Build dev pre-release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: dev-prerelease
  cancel-in-progress: true

jobs:
  build-app:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      source_sha: ${{ steps.release.outputs.source_sha }}
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js for Terser
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the firmware's pinned ARM toolchain
        run: |
          python -m pip install platformio==6.1.18
          pio pkg install --global --tool platformio/toolchain-gccarmnoneeabi@1.70201.0

      - name: Set pre-release tag
        id: release
        shell: bash
        run: |
          source_sha="$(git rev-parse HEAD)"
          version="$(date -u +%Y%m%d%H%M)-dev"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=${version}-${source_sha:0:7}" >> "$GITHUB_OUTPUT"

      - name: Build firmware and standalone app
        run: |
          pio run -e geiger2_spi_mini
          python tools/build_release.py --version "${{ steps.release.outputs.version }}" --spi-mini-bin .pio/build/geiger2_spi_mini/firmware.bin --require-minifier

      - name: Upload standalone HTML
        uses: actions/upload-artifact@v4
        with:
          name: dev-release-html
          path: dist/Dosimeter-App.html
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload firmware BIN
        uses: actions/upload-artifact@v4
        with:
          name: dev-release-firmware
          path: .pio/scratch/geiger2_manual/firmware.bin
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload SPI service firmware BIN
        uses: actions/upload-artifact@v4
        with:
          name: dev-release-spi-mini
          path: .pio/build/geiger2_spi_mini/firmware.bin
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  build-windows:
    needs: build-app
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-app.outputs.source_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js for Terser
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install desktop packaging dependencies
        run: python -m pip install -r tools/windows_app_requirements.txt

      - name: Download release firmware
        uses: actions/download-artifact@v4
        with:
          name: dev-release-firmware
          path: expected-firmware

      - name: Download SPI service firmware
        uses: actions/download-artifact@v4
        with:
          name: dev-release-spi-mini
          path: expected-spi-mini

      - name: Build Windows executable
        run: python tools/build_windows_app.py --version "${{ needs.build-app.outputs.version }}" --firmware-bin expected-firmware\firmware.bin --spi-mini-bin expected-spi-mini\firmware.bin --require-minifier

      - name: Verify firmware embedded in the Windows app
        run: >-
          python tools/verify_embedded_images.py
          --html .pio/scratch/windows-app/bundle/app/index.html
          --firmware-bin expected-firmware/firmware.bin
          --spi-mini-bin expected-spi-mini/firmware.bin

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: dev-release-windows
          path: dist/windows/Dosimeter-App.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish-prerelease:
    needs: [build-app, build-windows]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-app.outputs.source_sha }}

      - name: Download standalone HTML
        uses: actions/download-artifact@v4
        with:
          name: dev-release-html
          path: dist

      - name: Download firmware BIN
        uses: actions/download-artifact@v4
        with:
          name: dev-release-firmware
          path: firmware-staging

      - name: Download Windows executable
        uses: actions/download-artifact@v4
        with:
          name: dev-release-windows
          path: dist/windows

      - name: Download SPI service firmware
        uses: actions/download-artifact@v4
        with:
          name: dev-release-spi-mini
          path: spi-mini-staging

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build-app.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build-app.outputs.version }}
          SOURCE_SHA: ${{ needs.build-app.outputs.source_sha }}
        run: |
          cp spi-mini-staging/firmware.bin dist/spi-service-firmware.bin
          firmware="firmware-staging/firmware.bin"
          firmware_sha256="$(sha256sum "$firmware" | cut -d ' ' -f1)"
          canonical_sha256="$(python -c 'from pathlib import Path; import hashlib; b=Path("firmware-staging/firmware.bin").read_bytes(); print(hashlib.sha256(b.ljust(65536, bytes([255]))).hexdigest())')"
          windows_sha256="$(sha256sum dist/windows/Dosimeter-App.exe | cut -d ' ' -f1)"
          cat > /tmp/prerelease-notes.md <<EOF
          Development pre-release built from the dev branch.

          The HTML and Windows apps identify themselves as Version: ${RELEASE_VERSION}. This build is for testing and may change without notice.

          ## Changes
          - Improved parallel minute, hour, and day logging and faster log retrieval.
          - Improved minute, hour, and day graph navigation, cursor behavior, and redraw performance.
          - Expanded EEPROM and SPI NOR dump, flash, restore, and erase controls.
          - Improved Windows COM-port selection and the settings layout.
          - Centralized the firmware display palette for easier theme changes.

          Firmware BIN SHA-256: ${firmware_sha256}
          Canonical 64 KiB flash image SHA-256 (0xFF padded): ${canonical_sha256}
          Windows app SHA-256: ${windows_sha256}

          Built from commit ${SOURCE_SHA}. Tag timestamp is UTC.
          EOF
          gh release create "$RELEASE_TAG" \
            dist/Dosimeter-App.html \
            "$firmware" \
            dist/spi-service-firmware.bin \
            dist/windows/Dosimeter-App.exe \
            --title "DEV-$RELEASE_TAG" \
            --target "$SOURCE_SHA" \
            --prerelease \
            --notes-file /tmp/prerelease-notes.md
