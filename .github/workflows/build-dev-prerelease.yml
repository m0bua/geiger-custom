name: Build dev pre-release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: dev-prerelease
  cancel-in-progress: true

jobs:
  prepare-release:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      release_title: ${{ steps.release.outputs.release_title }}
      version: ${{ steps.release.outputs.version }}
      source_sha: ${{ steps.release.outputs.source_sha }}
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Set pre-release tag
        id: release
        shell: bash
        run: |
          source_sha="$(git rev-parse HEAD)"
          version="$(date -u +%Y%m%d%H%M)-dev"
          release_title="DEV-${version%-dev}-${source_sha:0:7}"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=${version}-${source_sha:0:7}" >> "$GITHUB_OUTPUT"
          echo "release_title=$release_title" >> "$GITHUB_OUTPUT"

  build-fw:
    needs: prepare-release
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.source_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned firmware toolchain
        run: |
          python -m pip install platformio==6.1.18
          pio pkg install --global --platform platformio/ststm32@20.0.0
          pio pkg install --global --tool platformio/toolchain-gccarmnoneeabi@1.70201.0

      - name: Build FW
        run: python tools/build_firmware.py

      - name: Upload FW
        uses: actions/upload-artifact@v4
        with:
          name: dev-release-firmware
          path: .pio/scratch/geiger2_manual/firmware.bin
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  build-fw-spi:
    needs: prepare-release
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.source_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.18

      - name: Build FW-SPI
        run: pio run -e geiger2_spi_mini

      - name: Upload FW-SPI
        uses: actions/upload-artifact@v4
        with:
          name: dev-release-spi-mini
          path: .pio/build/geiger2_spi_mini/firmware.bin
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  check-stock-sources:
    needs: prepare-release
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.source_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify stock firmware and source manifest
        run: python tools/verify_stock_sources.py

  build-app:
    needs: [prepare-release, build-fw, build-fw-spi, check-stock-sources]
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.source_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js for Terser
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download FW
        uses: actions/download-artifact@v4
        with:
          name: dev-release-firmware
          path: firmware-staging

      - name: Download FW-SPI
        uses: actions/download-artifact@v4
        with:
          name: dev-release-spi-mini
          path: spi-mini-staging

      - name: Build APP
        run: >-
          python tools/build_release.py
          --version "${{ needs.prepare-release.outputs.version }}"
          --firmware-bin firmware-staging/firmware.bin
          --spi-mini-bin spi-mini-staging/firmware.bin
          --require-minifier

      - name: Verify APP embedded images and source links
        run: >-
          python tools/verify_embedded_images.py
          --html dist/Dosimeter.html
          --firmware-bin firmware-staging/firmware.bin
          --spi-mini-bin spi-mini-staging/firmware.bin

      - name: Upload APP
        uses: actions/upload-artifact@v4
        with:
          name: dev-release-html
          path: dist/Dosimeter.html
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  build-windows:
    needs: [prepare-release, build-app, build-fw, build-fw-spi]
    if: github.ref == 'refs/heads/dev'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.source_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js for Terser
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install desktop packaging dependencies
        run: python -m pip install -r tools/windows_app_requirements.txt

      - name: Download release firmware
        uses: actions/download-artifact@v4
        with:
          name: dev-release-firmware
          path: expected-firmware

      - name: Download SPI service firmware
        uses: actions/download-artifact@v4
        with:
          name: dev-release-spi-mini
          path: expected-spi-mini

      - name: Build Windows executable
        run: python tools/build_windows_app.py --version "${{ needs.prepare-release.outputs.version }}" --firmware-bin expected-firmware\firmware.bin --spi-mini-bin expected-spi-mini\firmware.bin --require-minifier

      - name: Verify firmware embedded in the Windows app
        run: >-
          python tools/verify_embedded_images.py
          --html .pio/scratch/windows-app/bundle/app/index.html
          --firmware-bin expected-firmware/firmware.bin
          --spi-mini-bin expected-spi-mini/firmware.bin

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: dev-release-windows
          path: dist/windows/Dosimeter.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish-prerelease:
    needs: [prepare-release, build-app, build-fw, build-fw-spi, check-stock-sources, build-windows]
    if: github.ref == 'refs/heads/dev'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.source_sha }}

      - name: Download standalone HTML
        uses: actions/download-artifact@v4
        with:
          name: dev-release-html
          path: dist

      - name: Download firmware BIN
        uses: actions/download-artifact@v4
        with:
          name: dev-release-firmware
          path: firmware-staging

      - name: Download Windows executable
        uses: actions/download-artifact@v4
        with:
          name: dev-release-windows
          path: dist/windows

      - name: Download SPI service firmware
        uses: actions/download-artifact@v4
        with:
          name: dev-release-spi-mini
          path: spi-mini-staging

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          RELEASE_TITLE: ${{ needs.prepare-release.outputs.release_title }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare-release.outputs.source_sha }}
        run: |
          cp spi-mini-staging/firmware.bin dist/spi-service-firmware.bin
          firmware="firmware-staging/firmware.bin"
          firmware_sha256="$(sha256sum "$firmware" | cut -d ' ' -f1)"
          canonical_sha256="$(python -c 'from pathlib import Path; import hashlib; b=Path("firmware-staging/firmware.bin").read_bytes(); print(hashlib.sha256(b.ljust(65536, bytes([255]))).hexdigest())')"
          windows_sha256="$(sha256sum dist/windows/Dosimeter.exe | cut -d ' ' -f1)"
          cat > /tmp/prerelease-notes.md <<EOF
          Development pre-release built from the selected branch.

          The HTML and Windows apps identify themselves as Version: ${RELEASE_VERSION}. This build is for testing and may change without notice.

          ## Changes
          **Changes since 202611121527-dev-339c8fb:**
          - NORMAL rate decreases now ease down smoothly on the device using elapsed time; rising readings respond faster. Measured CPM, logs, alarms, and the SEARCH estimator remain unchanged.
          - Rate refresh follows priority: SEARCH or USB every 100 ms, screen on every 500 ms, NORMAL with screen off every second, and INVISIBLE with screen off and no USB every 5 seconds. In the three economical states, each pulse refreshes immediately and resets the timer.
          - The companion app reads device status every 100 ms while connected and keeps chart history on one-second buckets, accumulating all pulse counts in each point.
          - The rate chart supports two-finger pinch zoom on touchscreens, anchored around the gesture midpoint; one-finger dragging scrolls the history.
          - Display theme groups use one full-width row each on wide and narrow screens, and two side-by-side columns at intermediate widths. Tablet layouts stack labels above controls and place Reset and Power actions below the settings.
          - On narrow screens, connection status and controls have a separate row above the wrapping page tabs.
          - Live log refresh preserves the selected row order and rereads the previous live record from the device when a new period begins, including across paginated responses.
          - Updated the release portal: initially show three stable releases and the first newer pre-release. Stable history has its own Show more control; one shared pre-release control reveals all remaining pre-releases and older pre-releases.

          ### Known issue
          Battery percentage jumps while discharging remain under investigation.

          Firmware BIN SHA-256: ${firmware_sha256}
          Canonical 64 KiB flash image SHA-256 (0xFF padded): ${canonical_sha256}
          Windows app SHA-256: ${windows_sha256}

          Built from commit ${SOURCE_SHA}. Tag timestamp is UTC.
          EOF
          gh release create "$RELEASE_TAG" \
            dist/Dosimeter.html \
            "$firmware" \
            dist/spi-service-firmware.bin \
            dist/windows/Dosimeter.exe \
            --title "$RELEASE_TITLE" \
            --target "$SOURCE_SHA" \
            --prerelease \
            --notes-file /tmp/prerelease-notes.md
