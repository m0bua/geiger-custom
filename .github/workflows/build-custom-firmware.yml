name: Build custom firmware

on:
  workflow_dispatch:
    inputs:
      profile_json:
        description: Versioned firmware feature profile JSON
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: custom-firmware-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out trusted dev source
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Write submitted profile
        env:
          PROFILE_JSON: ${{ inputs.profile_json }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          Path(".pio/scratch/submitted-profile.json").parent.mkdir(parents=True, exist_ok=True)
          Path(".pio/scratch/submitted-profile.json").write_text(
              os.environ["PROFILE_JSON"], encoding="utf-8")
          PY

      - name: Install pinned ARM toolchain
        run: |
          python -m pip install platformio==6.1.18
          pio pkg install --global --platform platformio/ststm32@20.0.0
          pio pkg install --global --tool platformio/toolchain-gccarmnoneeabi@1.70201.0

      - name: Build profile and enforce Flash limit
        run: python tools/build_firmware.py --profile-json .pio/scratch/submitted-profile.json

      - name: Upload firmware and build report
        uses: actions/upload-artifact@v4
        with:
          name: custom-firmware-${{ github.run_id }}
          path: |
            .pio/scratch/geiger2_custom/firmware.bin
            .pio/scratch/geiger2_custom/firmware.hex
            .pio/scratch/geiger2_custom/profile.json
            .pio/scratch/geiger2_custom/build-summary.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
