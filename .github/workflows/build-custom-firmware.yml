name: Build custom firmware

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      source_branch:
        description: Firmware source branch
        type: choice
        options: [dev, main]
        required: true
      profile_json:
        description: Versioned firmware feature profile JSON
        type: string
        required: true

permissions:
  contents: read
  issues: write

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.action == 'opened' &&
      !github.event.issue.pull_request &&
      startsWith(github.event.issue.title, '[Custom firmware]'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out workflow source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate request and prepare profile
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DISPATCH_BRANCH: ${{ inputs.source_branch }}
          PROFILE_JSON: ${{ inputs.profile_json }}
        run: |
          python tools/prepare_custom_build_request.py

      - name: Acknowledge request
        if: github.event_name == 'issues' && steps.request.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh issue comment "$ISSUE_NUMBER" --repo "$GH_REPO" --body "Custom firmware request accepted and queued. [Follow this build]($RUN_URL)."

      - name: Check out selected firmware source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.source_branch }}
          path: firmware-source

      - name: Install pinned ARM toolchain
        working-directory: firmware-source
        run: |
          python -m pip install platformio==6.1.18
          pio pkg install --global --platform platformio/ststm32@20.0.0
          pio pkg install --global --tool platformio/toolchain-gccarmnoneeabi@1.70201.0

      - name: Build profile and enforce Flash limit
        working-directory: firmware-source
        run: python tools/build_firmware.py --profile-json "$GITHUB_WORKSPACE/.pio/scratch/submitted-profile.json"

      - name: Upload firmware and build report
        uses: actions/upload-artifact@v4
        with:
          name: custom-firmware-${{ github.run_id }}
          path: |
            firmware-source/.pio/scratch/geiger2_custom/firmware.bin
            firmware-source/.pio/scratch/geiger2_custom/firmware.hex
            firmware-source/.pio/scratch/geiger2_custom/profile.json
            firmware-source/.pio/scratch/geiger2_custom/build-summary.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Post request result
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REQUEST_OUTCOME: ${{ steps.request.outcome }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ "$REQUEST_OUTCOME" != "success" ]]; then
            body="The custom firmware request was rejected or could not be prepared. Check [the workflow run]($RUN_URL) for details."
          elif [[ "$JOB_STATUS" == "success" ]]; then
            body="Custom firmware build completed. Download the BIN, HEX, profile, and exact Flash report from [the workflow run]($RUN_URL). The artifact expires after 3 days."
          else
            body="Custom firmware build failed. Check [the workflow run]($RUN_URL) for details."
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GH_REPO" --body "$body"
