<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1115">
  <title>Dosimeter</title>
  <style>
    :root{color-scheme:dark;font:15px system-ui,sans-serif;background:#0b1115;color:#e6edf0;--muted:#8d9ba2;--line:#26343a;--green:#00e58b}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;background:radial-gradient(ellipse at 48% -20%,rgba(20,112,90,.15),transparent 56%),#0b1115}
    main{width:min(860px,calc(100% - 32px));margin:0 auto;padding:48px 0}
    header{padding-bottom:20px;border-bottom:1px solid var(--line)}h1{margin:0;font-size:24px}header p{margin:8px 0 0;color:var(--muted)}
    h2{margin:28px 0 12px;font-size:13px;color:var(--muted);letter-spacing:.12em}
    ul{list-style:none;padding:0;margin:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
    li+li{border-top:1px solid var(--line)}.version{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px;padding:14px 16px}
    .version>a{white-space:nowrap}
    a{color:var(--green);font-weight:650;text-decoration:none}a:hover{text-decoration:underline}.meta{color:var(--muted);font:11px ui-monospace,monospace}
    .meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:0}.release-date{white-space:nowrap}.downloads{display:block}.downloads a{white-space:nowrap}
    .release-history{position:relative}
    .release-history-toggle-input{position:absolute;width:1px;height:1px;opacity:0}
    .release-list>li:nth-child(n+2){display:none}
    .release-history-toggle-input:checked~section .release-list>li:nth-child(n+2){display:list-item}
    #stable-releases>li:nth-child(n+4){display:none}
    .release-history-toggle-input:checked~#stable-releases>li:nth-child(n+4){display:list-item}
    .release-history>#older-prereleases-section{display:none}
    .release-history-toggle-input:checked~#older-prereleases-section{display:block}
    .release-history-toggle{display:block;padding-top:6px;color:var(--green);font-size:12px;text-align:center;cursor:pointer}
    .release-history-toggle .show-less{display:none}
    .release-history-toggle::after{content:" ↓"}
    .release-history-toggle-input:checked~.release-history-toggle .show-more{display:none}
    .release-history-toggle-input:checked~.release-history-toggle .show-less{display:inline}
    .release-history-toggle-input:checked~.release-history-toggle::after{content:" ↑"}
    .release-history-toggle-input:focus-visible~.release-history-toggle{outline:2px solid var(--green);outline-offset:3px}
    .empty{padding:16px;color:var(--muted)}footer{margin-top:28px;color:var(--muted);font-size:12px}footer a{font-weight:500}
    @media(max-width:520px){main{padding:28px 0}.version{grid-template-columns:1fr;gap:7px}.version>a{white-space:normal;overflow-wrap:anywhere}.meta{align-items:flex-start}.release-date{white-space:normal;overflow-wrap:anywhere}}
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Dosimeter</h1>
      <p>Choose a release to open its matching app version.</p>
    </header>
    <!-- STABLE_RELEASES -->
    <!-- PRERELEASE_HISTORY -->
    <footer>Live app: <a href="./app/">latest development build</a> | <a href="https://github.com/m0bua/geiger-custom/releases">GitHub release notes</a></footer>
  </main>
</body>
</html>
